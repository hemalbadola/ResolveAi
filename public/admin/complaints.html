<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints Archive - Command Center</title>
    <meta name="description" content="Admin historical archive of all AI-routed network complaints.">
    <meta property="og:title" content="Command Center Archive">
    <meta property="og:description" content="Complete Ledger of System Frictions.">
    <meta property="og:type" content="website">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F766E',
                        'primary-light': '#14B8A6',
                        cta: '#0369A1',
                        'deep-bg': '#0B1120',
                    },
                    fontFamily: {
                        heading: ['Cinzel', 'serif'],
                        body: ['Josefin Sans', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Josefin Sans', sans-serif; background-color: #050814; color: #F8FAFC; }
        h1, h2, h3 { font-family: 'Cinzel', serif; }
        .data-mono { font-family: 'Fira Code', monospace; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Modal Overlay */
        .modal-bg {
            background: rgba(5, 8, 20, 0.9);
            backdrop-filter: blur(8px);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-primary-light selection:text-white">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-primary text-white px-4 py-2 z-[100]">Skip to main content</a>
    <!-- Sidebar Navigator -->
    <aside class="w-20 md:w-64 border-r border-slate-800 bg-[#0B1120] flex flex-col z-20 shrink-0 ease-in-out duration-300">
        <div class="h-16 flex justify-center md:justify-start items-center md:px-6 border-b border-slate-800">
            <i data-lucide="shield-alert" class="text-primary-light md:mr-3"></i>
            <h1 class="text-xl font-bold tracking-wider text-slate-100 hidden md:block">COMMAND</h1>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-6 space-y-2 px-3">
            <a href="dashboard.html" title="Overview" class="flex justify-center md:justify-start items-center px-3 py-2.5 text-slate-400 hover:text-white hover:bg-slate-800/30 transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5 md:mr-3"></i>
                <span class="font-medium hidden md:block">Overview</span>
            </a>
            <a href="#" class="flex justify-center md:justify-start items-center px-3 py-2.5 bg-slate-800/50 text-white border-l-2 border-primary-light rounded-r">
                <i data-lucide="inbox" class="w-5 h-5 md:mr-3 text-primary-light"></i>
                <span class="font-medium hidden md:block">Active Queue</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 hidden md:block">
            <button onclick="logout()" class="w-full flex items-center justify-center px-4 py-2 text-sm text-red-400 border border-red-900/50 hover:bg-red-900/20 transition-colors">
                <i data-lucide="log-out" class="w-4 h-4 mr-2"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 flex flex-col relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#050814] to-[#050814]">
        
        <!-- Header Controls -->
        <header class="h-20 p-6 flex items-center justify-between z-10">
            <h2 class="text-3xl text-white">Issue Ledger</h2>
            
            <div class="flex space-x-4">
                <select id="filter-status" class="bg-slate-900 border border-slate-700 text-slate-300 px-4 py-2 outline-none focus:border-primary-light text-sm" onchange="fetchComplaints()">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="in-progress">In-Progress</option>
                    <option value="resolved">Resolved</option>
                    <option value="rejected">Rejected</option>
                </select>
                <select id="filter-category" class="bg-slate-900 border border-slate-700 text-slate-300 px-4 py-2 outline-none focus:border-primary-light text-sm" onchange="fetchComplaints()">
                    <option value="">All Categories</option>
                    <option value="Academic">Academic</option>
                    <option value="Technical">Technical</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Administrative">Administrative</option>
                </select>
            </div>
        </header>

        <!-- Table View -->
        <div class="flex-1 overflow-auto px-6 pb-6">
            <div class="glass-panel overflow-hidden w-full">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800/80 sticky top-0 z-10 backdrop-blur-md">
                        <tr>
                            <th class="py-4 px-6 text-xs uppercase tracking-widest text-slate-400 font-bold">ID</th>
                            <th class="py-4 px-6 text-xs uppercase tracking-widest text-slate-400 font-bold">Priority/SLA</th>
                            <th class="py-4 px-6 text-xs uppercase tracking-widest text-slate-400 font-bold">Payload (Subject)</th>
                            <th class="py-4 px-6 text-xs uppercase tracking-widest text-slate-400 font-bold">Classification</th>
                            <th class="py-4 px-6 text-xs uppercase tracking-widest text-slate-400 font-bold">Entity</th>
                            <th class="py-4 px-6 text-xs uppercase tracking-widest text-slate-400 font-bold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-800/50">
                        <tr><td colspan="6" class="py-12 text-center text-slate-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i> Querying ledger...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination Controls -->
            <div class="mt-4 flex justify-between items-center text-sm text-slate-400">
                <div id="page-info">Page 1 of 1</div>
                <div class="space-x-2">
                    <button onclick="changePage(-1)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-white">PREV</button>
                    <button onclick="changePage(1)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-white">NEXT</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Detailed Investigation Modal -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-3xl max-h-[90vh] flex flex-col shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-slate-700 transform scale-95 transition-transform duration-300" id="modal-content">
            
            <header class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900/80">
                <h3 class="text-lg font-bold text-white uppercase tracking-widest flex items-center">
                    <i data-lucide="microscope" class="w-5 h-5 mr-2 text-primary-light"></i> Deep Investigation
                </h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </header>

            <div class="p-6 flex-1 overflow-y-auto space-y-6">
                <!-- Data display blocks -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-slate-800/30 p-3 border border-slate-700/50">
                        <span class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1">TKT-ID</span>
                        <span id="m-id" class="data-mono text-sm text-slate-200"></span>
                    </div>
                    <div class="bg-slate-800/30 p-3 border border-slate-700/50">
                        <span class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1">Category & Conf</span>
                        <span id="m-cat" class="text-sm font-semibold text-teal-400"></span>
                    </div>
                    <div class="bg-slate-800/30 p-3 border border-slate-700/50">
                        <span class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1">Sentiment Log</span>
                        <span id="m-sent" class="text-sm font-semibold text-slate-200"></span>
                    </div>
                    <div class="bg-slate-800/30 p-3 border border-slate-700/50">
                        <span class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1">SLA Status</span>
                        <span id="m-sla" class="text-sm font-semibold text-slate-200"></span>
                    </div>
                </div>

                <div class="bg-slate-800/30 p-5 border border-slate-700/50">
                    <h4 id="m-title" class="text-xl text-white font-medium mb-3"></h4>
                    <p id="m-desc" class="text-slate-400 text-sm whitespace-pre-wrap leading-relaxed"></p>
                </div>

                <!-- Admin Action Zone -->
                <div class="border-t border-slate-800 pt-6">
                    <h4 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-4">Commander Override</h4>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 uppercase tracking-wider">Update Status</label>
                            <select id="m-status-select" class="w-full md:w-1/3 bg-slate-900 border border-slate-700 px-4 py-3 text-slate-200 outline-none focus:border-primary-light uppercase text-sm tracking-wider">
                                <option value="pending">Pending</option>
                                <option value="in-progress">In-Progress</option>
                                <option value="resolved">Resolved</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1 uppercase tracking-wider">Official Resolution / Notes</label>
                            <textarea id="m-notes" rows="3" class="w-full bg-slate-900 border border-slate-700 px-4 py-3 text-slate-200 outline-none focus:border-primary-light resize-none placeholder:text-slate-600 text-sm" placeholder="Enter notes to be appended to the official ledger..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
            
            <footer class="p-5 border-t border-slate-800 bg-slate-900/80 flex justify-end space-x-4">
                <button onclick="closeModal()" class="px-6 py-2 border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors uppercase tracking-widest text-sm font-bold">Close</button>
                <button onclick="commitUpdate()" id="m-save-btn" class="px-8 py-2 bg-primary hover:bg-primary-light text-white uppercase tracking-widest text-sm font-bold transition-all flex items-center">
                    Commit Changes
                    <span id="m-spinner" class="hidden ml-2 w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                </button>
            </footer>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        lucide.createIcons();

        const token = localStorage.getItem('token');
        if (!token) window.location.href = '../login.html';

        let currentPage = 1;
        let totalPages = 1;
        let currentComplaintId = null;

        async function fetchComplaints() {
            const status = document.getElementById('filter-status').value;
            const category = document.getElementById('filter-category').value;
            const tbody = document.getElementById('table-body');
            
            tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i> Querying ledger...</td></tr>`;
            lucide.createIcons();

            try {
                let query = `?page=${currentPage}&limit=15&sort=-createdAt`;
                if (status) query += `&status=${status}`;
                if (category) query += `&category=${category}`;

                const res = await fetch(`${window.API_BASE_URL}/complaints${query}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                totalPages = data.pagination.pages;
                document.getElementById('page-info').innerText = `Page ${currentPage} of ${totalPages || 1}`;
                
                renderTable(data.complaints);
            } catch (err) {
                console.error("Fetch error", err);
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500">Error retrieving telemetry.</td></tr>`;
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'resolved': return 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10';
                case 'in-progress': return 'text-blue-400 border-blue-500/30 bg-blue-500/10';
                case 'rejected': return 'text-red-400 border-red-500/30 bg-red-500/10';
                default: return 'text-amber-500 border-amber-500/30 bg-amber-500/10';
            }
        }

        function getSLABadge(sla) {
            if (sla === 'Breached') return `<span class="ml-2 w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)] inline-block" title="Breached"></span>`;
            if (sla === 'At-Risk') return `<span class="ml-2 w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.8)] inline-block" title="At Risk"></span>`;
            return `<span class="ml-2 w-2 h-2 rounded-full bg-emerald-500 inline-block opacity-50" title="On Track"></span>`;
        }

        function renderTable(complaints) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            if (!complaints.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-slate-500">No records match criteria.</td></tr>`;
                return;
            }

            complaints.forEach(c => {
                const tr = document.createElement('tr');
                tr.className = `hover:bg-slate-800/30 transition-colors border-l-2 border-transparent hover:border-primary-light cursor-pointer focus-within:bg-slate-800/50`;
                tr.tabIndex = 0;
                tr.setAttribute('role', 'button');
                tr.setAttribute('aria-label', `View complaint ${c._id.substring(c._id.length-6).toUpperCase()}`);
                tr.onclick = () => openModal(c);
                tr.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(c); } };
                
                let slaBadge = getSLABadge(c.slaStatus);
                let dupAlert = c.duplicateOf ? '<i data-lucide="git-merge" class="inline w-3 h-3 text-blue-400 ml-2" title="Merged Duplicate"></i>' : '';

                tr.innerHTML = `
                    <td class="py-4 px-6 data-mono text-sm text-slate-400">#${c._id.substring(c._id.length-6).toUpperCase()}</td>
                    <td class="py-4 px-6 text-sm">
                        <span class="text-slate-300">Lvl ${c.priority}</span> ${slaBadge}
                    </td>
                    <td class="py-4 px-6 text-slate-200 font-medium truncate max-w-xs">${c.title} ${dupAlert}</td>
                    <td class="py-4 px-6 text-sm text-slate-400">${c.category} <span class="text-slate-600">(${c.aiConfidence <= 1 ? Math.round(c.aiConfidence * 100) : c.aiConfidence}%)</span></td>
                    <td class="py-4 px-6 text-sm text-slate-400 truncate max-w-[150px]">${c.submittedBy?.name || 'Unknown'}</td>
                    <td class="py-4 px-6">
                        <span class="px-2 py-1 ${getStatusColor(c.status)} text-xs font-semibold uppercase tracking-widest rounded border block text-center max-w-[120px]">
                            ${c.status}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                fetchComplaints();
            }
        }

        // Modal Logic
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');

        function openModal(c) {
            currentComplaintId = c._id;
            
            document.getElementById('m-id').innerText = '#' + c._id.toUpperCase();
            document.getElementById('m-cat').innerText = `${c.category} (${c.aiConfidence <= 1 ? Math.round(c.aiConfidence * 100) : c.aiConfidence}%)`;
            
            let sentColor = c.sentiment === 'Angry' || c.sentiment === 'Urgent' ? 'text-red-400' : 'text-slate-300';
            document.getElementById('m-sent').innerHTML = `<span class="${sentColor} uppercase">${c.sentiment}</span>`;
            
            let slaColor = c.slaStatus === 'Breached' ? 'text-violet-400 font-bold' : 'text-emerald-400';
            document.getElementById('m-sla').innerHTML = `<span class="${slaColor} uppercase">${c.slaStatus}</span>`;
            
            document.getElementById('m-title').innerText = c.title;
            document.getElementById('m-desc').innerText = c.description;
            
            document.getElementById('m-status-select').value = c.status;
            document.getElementById('m-notes').value = c.adminNotes || '';

            modal.classList.remove('hidden');
            // Small trigger delay for CSS transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        async function commitUpdate() {
            const btn = document.getElementById('m-save-btn');
            const spinner = document.getElementById('m-spinner');
            
            btn.disabled = true;
            spinner.classList.remove('hidden');

            const status = document.getElementById('m-status-select').value;
            const adminNotes = document.getElementById('m-notes').value;

            try {
                const res = await fetch(`${window.API_BASE_URL}/complaints/${currentComplaintId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status, adminNotes })
                });

                if (res.ok) {
                    closeModal();
                    fetchComplaints();
                } else {
                    alert('Failed to commit changes.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error during commit.');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }

        // Init
        fetchComplaints();

        // Close modal on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
