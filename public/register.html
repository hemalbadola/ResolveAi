<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join System - SYS_CORE</title>
    <meta name="description" content="Register as an entity in the AI Complaint Management network.">
    <meta property="og:title" content="Join Sys Core">
    <meta property="og:description" content="Create your secure instance.">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050814; color: #F8FAFC; font-family: 'Josefin Sans', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#050814] to-[#050814]">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-teal-500 text-white px-4 py-2 z-[100]">Skip to main content</a>
    <div id="main-content" class="glass-panel p-8 w-full max-w-md shadow-2xl relative overflow-hidden my-8">
        <div class="absolute top-0 right-0 w-full h-1 bg-gradient-to-l from-orange-500 to-teal-400"></div>
        
        <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold uppercase tracking-widest mb-2 text-center text-slate-200">Register Entity</h2>
        <p class="text-center text-slate-500 text-sm mb-6 max-w-prose tracking-wide leading-relaxed">Trusted by 10,000+ internal nodes globally. Initiate your secure terminal access.</p>
        
        <form id="register-form" class="space-y-4">
            <div>
                <label for="name" class="block text-sm text-slate-400 mb-1 tracking-wider uppercase font-semibold">Full Designation (Name)</label>
                <input type="text" id="name" required class="w-full min-h-[44px] bg-slate-900/80 border border-slate-700 focus:border-teal-500 rounded-none px-4 py-3 text-slate-200 outline-none transition-colors">
            </div>
            <div>
                <label for="email" class="block text-sm text-slate-400 mb-1 tracking-wider uppercase font-semibold">System Email</label>
                <input type="email" id="email" required class="w-full min-h-[44px] bg-slate-900/80 border border-slate-700 focus:border-teal-500 rounded-none px-4 py-3 text-slate-200 outline-none transition-colors">
            </div>
            <div>
                <label for="password" class="block text-sm text-slate-400 mb-1 tracking-wider uppercase font-semibold">Security Token (Password)</label>
                <input type="password" id="password" required minlength="6" class="w-full min-h-[44px] bg-slate-900/80 border border-slate-700 focus:border-teal-500 rounded-none px-4 py-3 text-slate-200 outline-none transition-colors">
            </div>
            
            <div class="pt-2">
                <fieldset>
                    <legend class="block text-sm text-slate-400 mb-2 tracking-wider uppercase font-semibold">Access Clearance Layer</legend>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center min-h-[44px] p-3 border border-slate-700 bg-slate-800/50 cursor-pointer hover:border-teal-500 transition-colors">
                            <input type="radio" name="role" value="student" checked aria-label="Student Role" class="form-radio text-teal-500 bg-slate-900 border-slate-700 focus:ring-teal-500 focus:ring-offset-slate-900">
                            <span class="ml-2 text-sm uppercase tracking-wider">Student</span>
                        </label>
                        <label class="flex items-center min-h-[44px] p-3 border border-slate-700 bg-slate-800/50 cursor-pointer hover:border-orange-500 transition-colors">
                            <input type="radio" name="role" value="admin" aria-label="Admin Role" class="form-radio text-orange-500 bg-slate-900 border-slate-700 focus:ring-orange-500 focus:ring-offset-slate-900">
                            <span class="ml-2 text-sm uppercase tracking-wider">Admin</span>
                        </label>
                    </div>
                </fieldset>
            </div>

            <div id="error-msg" class="text-red-400 text-sm hidden bg-red-900/20 border border-red-900/50 p-2 text-center mt-4"></div>
            
            <button type="submit" id="submit-btn" class="w-full py-4 min-h-[44px] bg-teal-700 hover:bg-teal-600 text-white uppercase tracking-widest font-bold transition-all disabled:opacity-50 mt-6 flex justify-center items-center">
                <span>Initialize</span>
                <span id="spinner" class="hidden ml-3 w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            </button>
        </form>
        
        <div class="mt-8 text-center text-sm text-slate-500">
            Already registered? <a href="login.html" class="text-teal-400 hover:text-teal-300">Authenticate</a>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const spinner = document.getElementById('spinner');
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.classList.add('hidden');
            btn.disabled = true;
            spinner.classList.remove('hidden');
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            
            try {
                const res = await fetch(`${window.API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    // Auto-login after registration
                    const loginRes = await fetch(`${window.API_BASE_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const loginData = await loginRes.json();
                    
                    if (loginRes.ok) {
                        localStorage.setItem('token', loginData.token);
                        localStorage.setItem('user', JSON.stringify(loginData.user));
                        window.location.href = role === 'admin' ? '/admin/dashboard.html' : '/student/dashboard.html';
                    } else {
                        window.location.href = '/login.html';
                    }
                } else {
                    errorDiv.innerText = data.message || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Network node unreachable';
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
