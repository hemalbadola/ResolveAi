<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Status Board - SYS_CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F766E',
                        'primary-light': '#14B8A6',
                    },
                    fontFamily: {
                        heading: ['Cinzel', 'serif'],
                        body: ['Josefin Sans', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Josefin Sans', sans-serif; background-color: #050814; color: #F8FAFC; }
        h1, h2, h3 { font-family: 'Cinzel', serif; }
        .data-mono { font-family: 'Fira Code', monospace; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .pulse-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-[#050814] to-[#050814] pb-20">
    <header class="h-16 border-b border-slate-800 bg-[#0B1120]/80 backdrop-blur-md flex items-center justify-between px-6 sticky top-0 z-50">
        <div class="flex items-center">
            <i data-lucide="activity" class="text-primary-light mr-3 w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-widest text-slate-100">SYSTEM_STATUS</h1>
        </div>
        <div class="flex items-center space-x-6">
            <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors flex items-center">
                <i data-lucide="home" class="w-4 h-4 mr-2"></i> Return Home
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-10 mt-8">
        <div class="mb-12 text-center">
            <h2 class="text-4xl font-bold uppercase tracking-widest mb-4">Live Incident Radar</h2>
            <p class="text-slate-400 text-lg flex items-center justify-center">
                <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot mr-2"></span>
                System Operational. Last synced: <span id="last-sync" class="ml-2 font-mono text-white">Just now</span>
            </p>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12" id="kpi-container">
            <div class="glass-panel p-6 text-center animate-pulse h-32"></div>
            <div class="glass-panel p-6 text-center animate-pulse h-32"></div>
            <div class="glass-panel p-6 text-center animate-pulse h-32"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Active Issues by Category -->
            <div class="glass-panel p-8">
                <h3 class="text-xl font-bold uppercase tracking-widest mb-6 flex items-center border-b border-slate-800 pb-4">
                    <i data-lucide="alert-triangle" class="w-5 h-5 mr-3 text-amber-500"></i> Active Incidents by Sector
                </h3>
                <div id="category-list" class="space-y-4">
                    <div class="text-center text-slate-500 py-4"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i> Loading data...</div>
                </div>
            </div>

            <!-- Recently Resolved -->
            <div class="glass-panel p-8">
                <h3 class="text-xl font-bold uppercase tracking-widest mb-6 flex items-center border-b border-slate-800 pb-4">
                    <i data-lucide="check-circle" class="w-5 h-5 mr-3 text-emerald-500"></i> Recently Restored
                </h3>
                <div id="resolved-list" class="space-y-4">
                    <div class="text-center text-slate-500 py-4"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i> Loading data...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script>
        lucide.createIcons();

        async function fetchStatus() {
            try {
                const res = await fetch(`${window.API_BASE_URL}/public/status`);
                const data = await res.json();
                
                document.getElementById('last-sync').innerText = new Date().toLocaleTimeString();

                // KPIs
                document.getElementById('kpi-container').innerHTML = `
                    <div class="glass-panel p-6 border-t-2 border-emerald-500 flex flex-col items-center justify-center">
                        <p class="text-slate-400 text-sm uppercase tracking-widest mb-1">Total Logs</p>
                        <p class="text-4xl font-bold data-mono">${data.overall.total}</p>
                    </div>
                    <div class="glass-panel p-6 border-t-2 border-amber-500 flex flex-col items-center justify-center">
                        <p class="text-slate-400 text-sm uppercase tracking-widest mb-1">Pending Resolution</p>
                        <p class="text-4xl font-bold data-mono">${data.overall.pending}</p>
                    </div>
                    <div class="glass-panel p-6 border-t-2 border-blue-500 flex flex-col items-center justify-center">
                        <p class="text-slate-400 text-sm uppercase tracking-widest mb-1">Resolution Rate</p>
                        <p class="text-4xl font-bold data-mono">${data.overall.resolutionRate}%</p>
                    </div>
                `;

                // Categories
                const catList = document.getElementById('category-list');
                if (data.activeByCategory.length === 0) {
                    catList.innerHTML = '<p class="text-slate-500 text-center py-4">No active incidents.</p>';
                } else {
                    catList.innerHTML = data.activeByCategory.map(c => `
                        <div class="flex justify-between items-center bg-slate-800/30 p-3 rounded">
                            <span class="text-slate-300 font-medium">${c._id || 'Uncategorized'}</span>
                            <span class="px-3 py-1 bg-amber-500/10 text-amber-500 border border-amber-500/30 rounded data-mono text-sm">${c.count} Active</span>
                        </div>
                    `).join('');
                }

                // Resolved
                const resList = document.getElementById('resolved-list');
                if (data.recentResolved.length === 0) {
                    resList.innerHTML = '<p class="text-slate-500 text-center py-4">No recently resolved logs.</p>';
                } else {
                    resList.innerHTML = data.recentResolved.map(r => `
                        <div class="flex flex-col bg-slate-800/30 p-3 rounded">
                            <span class="text-slate-300 font-medium mb-1 truncate">${r.title}</span>
                            <div class="flex justify-between items-center text-xs text-slate-500">
                                <span>${r.category}</span>
                                <span>${new Date(r.resolvedAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `).join('');
                }

            } catch (err) {
                console.error("Failed to fetch status:", err);
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 30000); // Auto-refresh every 30s
    </script>
</body>
</html>
